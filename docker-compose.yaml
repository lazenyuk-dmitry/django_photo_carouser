version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "django_db"
      MYSQL_USER: "admin"
      MYSQL_PASSWORD: "admin"
      MYSQL_ROOT_PASSWORD: "admin"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: web_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/home/appuser/app
      - static_volume:/home/appuser/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
  static_volume:
